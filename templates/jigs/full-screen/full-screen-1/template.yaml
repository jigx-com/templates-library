title: Full screen location
type: jig.full-screen

component:
  type: component.location
  options:
    viewPoint:
      address: =@ctx.datasources.location.address
      zoomLevel: 10
    # Add a pin to the exact address.
    markers:
      data: =@ctx.datasources.location.address
      item:
        type: component.marker-item
        options:
          address: =@ctx.datasources.location.address
          children:
            type: component.icon
            options:
              color: negative
              icon: end-marker
