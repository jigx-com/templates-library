title: List with ratings
type: jig.list

header:
  type: component.jig-header
  options:
    height: medium
    children:
      type: component.image
      options:
        source:
          uri: https://images.unsplash.com/photo-1556742212-5b321f3c261b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDF8MHxzZWFyY2h8OHx8cGF5bWVudHxlbnwwfHwwfHx8Mg%3D%3D
        title: List with ratings
        subtitle: Rating with customized icon, color and maximum

data: =@ctx.datasources.mydata
item:
  type: component.list-item
  options:
    isContained: true
    title: =@ctx.current.item.title
    description: =@ctx.current.item.subtitle
    leftElement:
      element: image
      text: ''
      uri: =@ctx.current.item.productImage
    rating:
      value: =@ctx.current.item.rating
      ratingIcon:
        color: color3
        current: =@ctx.current.item.ratingValue
        icon: rating-star-1
        maximum: 5
      text: =@ctx.current.item.ratingText