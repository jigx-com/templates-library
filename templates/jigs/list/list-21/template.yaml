title: Contained list
type: jig.list

header:
  type: component.jig-header
  options:
    height: medium
    children:
      type: component.image
      options:
        source:
          uri: https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fG5hdHVyZXxlbnwwfHwwfHx8Mg%3D%3D
        title: Contained list
        subtitle: List contained in a card

data: =@ctx.datasources.mydata
item:
  type: component.list-item
  options:
    isContained: true
    title: =@ctx.current.item.title
    subtitle: =@ctx.current.item.subtitle
    description: =@ctx.current.item.description
    leftElement: 
      element: image
      text: ''
      uri: =@ctx.current.item.img
    label: 
      title: =@ctx.current.item.label
      isHidden: false
      color:
        - when: true
          color: color2