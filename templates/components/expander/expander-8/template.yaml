type: component.expander
options:
  header:
    centerElement:
      type: component.titles
      options:
        title: Title
        subtitle: Subtitle
  children:
    - type: component.location
      options:
        viewPoint:
          centerPosition: middle
          address: =@ctx.datasources.location.address
        markers:
          data: =@ctx.datasources.location.address
          item:
            type: component.marker-item
            options:
              address: =@ctx.datasources.location.address
              children:
                type: component.icon
                options:
                  color: negative
                  icon: pin-map
  isInitiallyCollapsed: false
