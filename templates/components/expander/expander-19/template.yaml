type: component.expander
options:
  header:
    centerElement:
      type: component.stage
      options:
        left:
          subtitle: Subtitle
          title: Start title
        right:
          subtitle: Subtitle
          title: End title
  children:
    - type: component.location
      options:
        viewPoint:
          centerPosition: middle
          address: =@ctx.datasources.location-us.address
        markers:
          data: =@ctx.datasources.location-us.address
          item:
            type: component.marker-item
            options:
              address: =@ctx.datasources.location-us.address
              children:
                type: component.icon
                options:
                  color: negative
                  icon: pin-map
  isInitiallyCollapsed: false
