type: component.location
options:
  viewPoint:
    centerPosition: middle
    latitude: 40.759412
    longitude: -73.912306
    address: =@ctx.datasources.points
  markers:
    data: =@ctx.datasources.points
    item:
      type: component.marker-item
      options:
        latitude: =@ctx.current.item.latitude
        longitude: =@ctx.current.item.longitude
        radius:
          isEnabled: true
          value: 4
          unit: kilometers
          color: color4
        children:
          type: component.icon
          options:
            icon: end-marker
