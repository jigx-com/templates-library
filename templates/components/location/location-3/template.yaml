type: component.location
options:
  viewPoint:
    centerPosition: middle
    latitude: 40.769702
    longitude: -74.038241
  paths:
    data: =@ctx.datasources.coordinates
  markers:
    data: =@ctx.datasources.coordinates
    item:
      type: component.marker-item
      options:
        latitude: =@ctx.current.item.latitude
        longitude: =@ctx.current.item.longitude
        zoomLevel: 9
        children:
          type: component.icon
          options:
            icon: pin-map
            color:
              - when: =@ctx.current.item.latitude = 40.759412 or @ctx.current.item.latitude = 40.803495
                color: negative
              - when: =@ctx.current.item.latitude = 40.769702
                color: color2
