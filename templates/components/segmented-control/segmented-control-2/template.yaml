type: component.section
options:
  title: Segmented-control with lists and when conditions
  children:
    - type: component.segmented-control
      instanceId: default-segment
      options:
        initialValue: onDuty
        data:
          - title: On Duty
            value: onDuty
          - title: Available
            value: available
          - title: Off Duty
            value: offDuty
    - type: component.list
      options:
        data: =@ctx.datasources.team-members[status = @ctx.components.default-segment.state.value]
        maximumItemsToRender: 8
        item:
          type: component.list-item
          options:
            title: =@ctx.current.item.name
            subtitle: ="Team " & @ctx.current.item.team
            leftElement:
              element: avatar
              text: =$uppercase($substring($substringBefore(@ctx.current.item.name, " "), 0, 1) & $substring($substringAfter(@ctx.current.item.name, " ") , 0, 1) )
            rightElement:
              element: value
              text: =@ctx.current.item.role
              color:
                - when: =@ctx.current.item.status = 'onDuty'
                  color: color1
                - when: =@ctx.current.item.status = 'available'
                  color: color4
                - when: =@ctx.current.item.status = 'offDuty'
                  color: color7
