type: component.card
options:
  children:
    - type: component.location
      options:
        viewPoint:
          centerPosition: middle
          address: =@ctx.datasources.location.address
          zoomLevel: 10
          isAnimationEnabled: false
        markers:
          data: =@ctx.datasources.location.address
          item:
            type: component.marker-item
            options:
              address: =@ctx.datasources.location.address
              children:
                type: component.icon
                options:
                  color: negative
                  icon: end-marker
    - type: component.entity
      options:
        children:
          - type: component.entity-field
            options:
              label: Address
              value: =@ctx.datasources.location.address
