        size: 1x1
        children:
          type: component.jig-widget
          options:
            jigId: placeholder
    - type: component.grid-item
      options:
        size: "1x1"
        children:
          type: component.jig-widget
          options:
            jigId: placeholder
            icon: delivery-truck-2
            title: " "
    - type: component.grid-item
      options:
        size: "1x1"
        children:
          type: component.jig-widget
