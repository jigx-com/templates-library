        children:
          type: component.image
          options:
            source:
              uri: https://images.unsplash.com/photo-1587582423116-ec07293f0395?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Y29uc3RydWN0aW9ufGVufDB8fDB8fHww
    - type: component.grid-item
      options:
        size: "2x2"
        children:
          type: component.image
          options:
            source:
              uri: https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGNvbnN0cnVjdGlvbnxlbnwwfHwwfHx8MA%3D%3D
            title: Welding
    - type: component.grid-item
