# Please configure your 'data' property to use the 'mydata' datasource, eg: =@ctx.datasources.mydata
type: component.list-item
options:
  title: =@ctx.current.item.service
  subtitle: ='Duration of ' & @ctx.current.item.time & ' mins'
  horizontalItemSize: large
  isContained: true     
  rating: 
    ratingIcon:
      icon: thumb-up-like
      color: color7
    value: 
      current: =@ctx.current.item.rating
      maximum: 5       
  tags:
    - text: =('$' & @ctx.current.item.hourlyrate)
      color: color14
    - text: =@ctx.current.item.area
      color: color14
  leftElement: 
    element: image
    text: ''
    uri: =@ctx.current.item.image
  rightElement:         
    element: badge
    value: =@ctx.current.item.quantity